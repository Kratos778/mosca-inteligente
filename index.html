<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mosca Inteligente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 { font-size: 1.1rem; }
    .btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn:active { background: #555; }
    .btn.danger { background: #8b0000; }
    .btn.primary { background: #1a5fb4; }
    #game-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #2d2d2d;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.75);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      line-height: 1.45;
      pointer-events: none;
    }
    #brain-status {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    #brain-status.off { background: #5c1a1a; color: #ffaaaa; }
    #brain-status.on { background: #1a3d1a; color: #aaffaa; }
    #thought {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.88);
      color: #ffd700;
      padding: 12px 18px;
      border-radius: 12px;
      max-width: 90%;
      text-align: center;
      font-size: 0.95rem;
      display: none;
      z-index: 20;
    }
    #controls {
      padding: 12px;
      background: #111;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid #333;
    }
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal.show { display: flex; }
    .modal-box {
      background: #222;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
    }
    .modal-box h2 { margin-bottom: 12px; }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }
    .modal-box p { font-size: 0.85rem; color: #aaa; margin-bottom: 12px; }
    #death-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 30;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    #death-screen.show { display: flex; }
    #death-screen h2 { color: #ff5555; margin-bottom: 12px; }
    #death-thought {
      background: #222;
      padding: 16px;
      border-radius: 12px;
      max-width: 90%;
      margin: 16px 0;
      color: #ffd700;
      font-style: italic;
    }
    .lives { font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>🐞 Mosca Inteligente</h1>
    <button class="btn" id="btn-settings">⚙️</button>
  </header>

  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="brain-status" class="off">Cérebro: DESLIGADO</div>
    <div id="thought"></div>
    <div id="death-screen">
      <h2>A mosca morreu</h2>
      <div class="lives">Vida <span id="life-count">1</span></div>
      <div id="death-thought"></div>
      <button class="btn primary" id="btn-revive">Nascer de novo</button>
    </div>
  </div>

  <div id="controls">
    <button class="btn danger" id="btn-spray">🧴 Spray</button>
    <button class="btn" id="btn-window">🪟 Fechar Janela</button>
    <button class="btn" id="btn-hand">🤚 Mão</button>
  </div>

  <div id="modal">
    <div class="modal-box">
      <h2>Configurações</h2>
      <p><strong>Sem chave API o cérebro fica desligado.</strong><br>
      A mosca só voa de forma básica e aleatória. Não existe inteligência falsa.</p>
      <p>Cole sua chave do Grok (console.x.ai) para ligar o cérebro de verdade.</p>
      <input type="password" id="api-key" placeholder="xai-..." />
      <div style="display:flex; gap:10px;">
        <button class="btn primary" id="btn-save-key" style="flex:1">Salvar</button>
        <button class="btn" id="btn-close-modal">Fechar</button>
      </div>
      <p style="margin-top:16px; font-size:0.8rem;">
        Memórias de morte: <span id="mem-count">0</span><br>
        <button class="btn" id="btn-clear-mem" style="margin-top:8px; font-size:0.8rem">Limpar memórias</button>
      </p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const state = {
      fly: {
        x: 0, y: 0,
        vx: 0, vy: 0,
        angle: 0,
        energy: 100,
        hunger: 30,
        fear: 0,
        alive: true,
        target: null,
        action: 'nada',
        thought: ''
      },
      objects: [],
      sprayActive: false,
      sprayTimer: 0,
      windowClosed: false,
      handActive: false,
      handTimer: 0,
      life: 1,
      lastDecision: 0,
      deciding: false,
      apiKey: localStorage.getItem('grok_key') || '',
      memories: JSON.parse(localStorage.getItem('fly_memories') || '[]')
    };

    function resize() {
      canvas.width = canvas.offsetWidth * devicePixelRatio;
      canvas.height = canvas.offsetHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener('resize', () => {
      resize();
      if (state.fly.x === 0) spawnFly();
    });
    resize();

    function createWorld() {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      state.objects = [
        { type: 'sugar', x: w * 0.2, y: h * 0.7, r: 18, label: '\uD83C\uDF6C' },
        { type: 'fruit', x: w * 0.75, y: h * 0.6, r: 22, label: '\uD83C\uDF4E' },
        { type: 'light', x: w * 0.5, y: 40, r: 25, label: '\uD83D\uDCA1' },
        { type: 'trash', x: w * 0.85, y: h * 0.85, r: 20, label: '\uD83D\uDDD1\uFE0F' },
        { type: 'window', x: w * 0.1, y: h * 0.25, r: 30, label: '\uD83E\uDE9F' }
      ];
    }

    function spawnFly() {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      state.fly.x = w * 0.5;
      state.fly.y = h * 0.4;
      state.fly.vx = (Math.random() - 0.5) * 1.2;
      state.fly.vy = (Math.random() - 0.5) * 1.2;
      state.fly.energy = 100;
      state.fly.hunger = 25 + Math.random() * 20;
      state.fly.fear = 0;
      state.fly.alive = true;
      state.fly.target = null;
      state.fly.action = 'nada';
      state.fly.thought = '';
      state.sprayActive = false;
      state.handActive = false;
      state.windowClosed = false;
      state.deciding = false;
      document.getElementById('death-screen').classList.remove('show');
      createWorld();
      updateBrainStatus();
    }

    function updateBrainStatus() {
      const el = document.getElementById('brain-status');
      if (state.apiKey) {
        el.textContent = 'C\u00e9rebro: GROK LIGADO';
        el.className = 'on';
      } else {
        el.textContent = 'C\u00e9rebro: DESLIGADO';
        el.className = 'off';
      }
    }

    function saveMemory(cause, thought) {
      state.memories.push({ life: state.life, cause, thought, time: Date.now() });
      if (state.memories.length > 25) state.memories.shift();
      localStorage.setItem('fly_memories', JSON.stringify(state.memories));
      updateMemCount();
    }

    function updateMemCount() {
      document.getElementById('mem-count').textContent = state.memories.length;
    }

    // ===================== C\u00c9REBRO HONESTO =====================
    // S\u00f3 chama Grok se tiver chave. Sem chave = nenhum pensamento inteligente.
    async function decide() {
      if (!state.fly.alive || state.deciding) return;

      // SEM CHAVE = c\u00e9rebro desligado. N\u00e3o inventa intelig\u00eancia.
      if (!state.apiKey) {
        state.fly.action = 'nada';
        state.fly.target = null;
        state.fly.thought = '';
        return;
      }

      state.deciding = true;

      const memoriesText = state.memories.slice(-10).map(m =>
        `Vida ${m.life}: morreu por "${m.cause}" \u2014 pensou: "${m.thought}"`
      ).join('\n') || 'Nenhuma morte ainda. Esta \u00e9 a primeira vida.';

      const prompt = `Voc\u00ea \u00e9 o c\u00e9rebro de uma mosca real. Responda APENAS com JSON v\u00e1lido, sem markdown e sem explica\u00e7\u00e3o.

Estado atual da mosca:
- Energia: ${state.fly.energy.toFixed(0)}
- Fome: ${state.fly.hunger.toFixed(0)}
- Medo: ${state.fly.fear.toFixed(0)}
- Spray ativo agora: ${state.sprayActive}
- Janela est\u00e1 fechada: ${state.windowClosed}
- M\u00e3o do humano est\u00e1 tentando matar: ${state.handActive}

Mem\u00f3rias de mortes anteriores (use para aprender de verdade):
${memoriesText}

Objetos dispon\u00edveis: a\u00e7\u00facar, fruta, luz, lixo, janela.

Escolha UMA a\u00e7\u00e3o entre:
"ir_acucar", "ir_fruta", "ir_luz", "ir_lixo", "ir_janela", "fugir", "explorar", "descansar"

Responda exatamente assim:
{"action":"nome_da_acao","thought":"pensamento curto e natural da mosca em portugu\u00eas"}`;

      try {
        const res = await fetch('https://api.x.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + state.apiKey
          },
          body: JSON.stringify({
            model: 'grok-3',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.85,
            max_tokens: 100
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          console.error('Erro API:', res.status, errText);
          showThought('(erro na API do Grok)');
          state.deciding = false;
          return;
        }

        const data = await res.json();
        const text = data.choices?.[0]?.message?.content || '';
        const match = text.match(/\{[\s\S]*?\}/);

        if (match) {
          const parsed = JSON.parse(match[0]);
          state.fly.action = parsed.action || 'explorar';
          state.fly.thought = parsed.thought || '';
          showThought(state.fly.thought);
          setTargetFromAction(state.fly.action);
        } else {
          showThought('(resposta inv\u00e1lida do Grok)');
        }
      } catch (e) {
        console.error(e);
        showThought('(falha de conex\u00e3o com Grok)');
      }

      state.deciding = false;
    }

    function setTargetFromAction(action) {
      const map = {
        ir_acucar: 'sugar',
        ir_fruta: 'fruit',
        ir_luz: 'light',
        ir_lixo: 'trash',
        ir_janela: 'window'
      };
      if (map[action]) {
        state.fly.target = state.objects.find(o => o.type === map[action]) || null;
      } else {
        state.fly.target = null;
      }
    }

    function showThought(text) {
      if (!text) return;
      const el = document.getElementById('thought');
      el.textContent = text;
      el.style.display = 'block';
      clearTimeout(window._thoughtTimer);
      window._thoughtTimer = setTimeout(() => { el.style.display = 'none'; }, 4500);
    }

    // ===================== F\u00cdSICA / CORPO =====================
    function update(dt) {
      if (!state.fly.alive) return;
      const f = state.fly;
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;

      f.hunger = Math.min(100, f.hunger + dt * 2.8);
      f.energy = Math.max(0, f.energy - dt * 1.2);
      if (f.fear > 0) f.fear = Math.max(0, f.fear - dt * 7);

      if (state.sprayActive) {
        state.sprayTimer -= dt;
        f.fear = Math.min(100, f.fear + dt * 35);
        if (state.sprayTimer <= 0) state.sprayActive = false;
        const dist = Math.hypot(f.x - w/2, f.y - h/2);
        if (dist < 120 && Math.random() < 0.025) {
          killFly('spray venenoso');
          return;
        }
      }

      if (state.handActive) {
        state.handTimer -= dt;
        f.fear = Math.min(100, f.fear + dt * 45);
        if (state.handTimer <= 0) state.handActive = false;
      }

      // Movimento do corpo
      if (f.action === 'fugir') {
        f.vx += (f.x - w/2) * 0.015;
        f.vy += (f.y - h/2) * 0.015;
      } else if (f.target) {
        const dx = f.target.x - f.x;
        const dy = f.target.y - f.y;
        const dist = Math.hypot(dx, dy) || 1;
        f.vx += (dx / dist) * 0.7;
        f.vy += (dy / dist) * 0.7;

        if (dist < f.target.r + 12) {
          if (f.target.type === 'sugar' || f.target.type === 'fruit') {
            f.hunger = Math.max(0, f.hunger - 35);
            f.energy = Math.min(100, f.energy + 18);
          }
          if (f.target.type === 'window' && state.windowClosed) {
            killFly('bateu na janela fechada');
            return;
          }
        }
      } else {
        // Sem c\u00e9rebro ou a\u00e7\u00e3o "nada"/explorar: s\u00f3 voo b\u00e1sico aleat\u00f3rio (corpo)
        f.vx += (Math.random() - 0.5) * 0.35;
        f.vy += (Math.random() - 0.5) * 0.35;
      }

      const speed = Math.hypot(f.vx, f.vy);
      const maxSpeed = f.action === 'fugir' ? 5.5 : 3.2;
      if (speed > maxSpeed) {
        f.vx = (f.vx / speed) * maxSpeed;
        f.vy = (f.vy / speed) * maxSpeed;
      }

      f.x += f.vx;
      f.y += f.vy;
      f.vx *= 0.95;
      f.vy *= 0.95;

      if (f.x < 12) { f.x = 12; f.vx *= -0.5; }
      if (f.x > w - 12) { f.x = w - 12; f.vx *= -0.5; }
      if (f.y < 12) { f.y = 12; f.vy *= -0.5; }
      if (f.y > h - 12) { f.y = h - 12; f.vy *= -0.5; }

      f.angle = Math.atan2(f.vy, f.vx);

      if (f.energy <= 0) {
        killFly('exaurida de tanto voar');
        return;
      }

      // S\u00f3 pede decis\u00e3o se o c\u00e9rebro estiver ligado
      state.lastDecision += dt;
      if (state.apiKey && state.lastDecision > 5) {
        state.lastDecision = 0;
        decide();
      }
    }

    function killFly(cause) {
      if (!state.fly.alive) return;
      state.fly.alive = false;

      let finalThought = state.fly.thought
        ? `\u00daltima coisa que pensei: "${state.fly.thought}". A\u00ed veio ${cause}.`
        : `Morri por ${cause}. N\u00e3o deu tempo de pensar.`;

      // Se tiver chave, podemos deixar o \u00faltimo pensamento do Grok
      if (!state.apiKey) {
        finalThought = `Morri por ${cause}. (c\u00e9rebro estava desligado)`;
      }

      saveMemory(cause, finalThought);

      document.getElementById('life-count').textContent = state.life;
      document.getElementById('death-thought').textContent = '"' + finalThought + '"';
      document.getElementById('death-screen').classList.add('show');
    }

    // ===================== DESENHO =====================
    function draw() {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(0, 0, w, h);

      // Janela
      ctx.fillStyle = state.windowClosed ? '#555' : '#87ceeb';
      ctx.fillRect(20, h * 0.15, 70, 90);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, h * 0.15, 70, 90);

      state.objects.forEach(o => {
        ctx.font = '28px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(o.label, o.x, o.y);
      });

      if (state.sprayActive) {
        ctx.fillStyle = 'rgba(100, 200, 100, 0.28)';
        ctx.beginPath();
        ctx.arc(w/2, h/2, 130, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.handActive) {
        ctx.font = '40px serif';
        ctx.fillText('\uD83E\uDD1A', w/2, h/2);
      }

      if (state.fly.alive) {
        const f = state.fly;
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);

        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(200,200,255,0.5)';
        ctx.beginPath();
        ctx.ellipse(-4, -6, 7, 3, -0.4, 0, Math.PI * 2);
        ctx.ellipse(-4, 6, 7, 3, 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(7, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      const f = state.fly;
      document.getElementById('hud').innerHTML =
        'Vida: ' + state.life + '<br>' +
        'Energia: ' + f.energy.toFixed(0) + '<br>' +
        'Fome: ' + f.hunger.toFixed(0) + '<br>' +
        'Medo: ' + f.fear.toFixed(0) + '<br>' +
        'A\u00e7\u00e3o: ' + f.action + '<br>' +
        'Mem\u00f3rias: ' + state.memories.length;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // ===================== CONTROLES =====================
    document.getElementById('btn-spray').onclick = () => {
      if (!state.fly.alive) return;
      state.sprayActive = true;
      state.sprayTimer = 3.5;
      state.fly.fear = Math.min(100, state.fly.fear + 40);
    };

    document.getElementById('btn-window').onclick = () => {
      state.windowClosed = !state.windowClosed;
    };

    document.getElementById('btn-hand').onclick = () => {
      if (!state.fly.alive) return;
      state.handActive = true;
      state.handTimer = 1.8;
      const f = state.fly;
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      if (Math.hypot(f.x - w/2, f.y - h/2) < 90 && Math.random() < 0.55) {
        killFly('esmagada pela m\u00e3o');
      }
    };

    canvas.addEventListener('click', (e) => {
      if (!state.fly.alive) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (Math.hypot(x - state.fly.x, y - state.fly.y) < 45) {
        state.handActive = true;
        state.handTimer = 1.2;
        if (Math.random() < 0.65) killFly('esmagada pela m\u00e3o');
      }
    });

    document.getElementById('btn-revive').onclick = () => {
      state.life++;
      spawnFly();
      if (state.apiKey) setTimeout(decide, 900);
    };

    document.getElementById('btn-settings').onclick = () => {
      document.getElementById('api-key').value = state.apiKey;
      updateMemCount();
      document.getElementById('modal').classList.add('show');
    };

    document.getElementById('btn-close-modal').onclick = () => {
      document.getElementById('modal').classList.remove('show');
    };

    document.getElementById('btn-save-key').onclick = () => {
      state.apiKey = document.getElementById('api-key').value.trim();
      localStorage.setItem('grok_key', state.apiKey);
      updateBrainStatus();
      document.getElementById('modal').classList.remove('show');
      if (state.apiKey) {
        alert('C\u00e9rebro Grok ligado.');
        decide();
      } else {
        alert('C\u00e9rebro desligado. Mosca s\u00f3 voa de forma b\u00e1sica.');
      }
    };

    document.getElementById('btn-clear-mem').onclick = () => {
      if (confirm('Apagar todas as mem\u00f3rias de morte?')) {
        state.memories = [];
        localStorage.removeItem('fly_memories');
        updateMemCount();
      }
    };

    // Start
    spawnFly();
    updateMemCount();
    updateBrainStatus();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
